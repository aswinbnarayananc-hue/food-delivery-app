<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Delivery Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            🍔 Food Delivery System
        </span>

        <a href="/logout" class="btn btn-danger">
            Logout
        </a>

    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center">

            <h1 class="mb-3">
                Welcome, {{ username }}
            </h1>

            <p class="lead">
                Order your favorite food quickly and easily.
            </p>

            <hr>

            <div class="d-grid gap-3 col-6 mx-auto">

                <a href="/menu" class="btn btn-primary btn-lg">
                    🍕 View Food Menu
                </a>

                <a href="/orders" class="btn btn-success btn-lg">
                    📋 My Orders
                </a>

                <a href="/logout" class="btn btn-danger btn-lg">
                    🚪 Logout
                </a>

            </div>

        </div>

    </div>

    <!-- Features Section -->
    <div class="row mt-5">

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h3>🍔 Fast Delivery</h3>
                    <p>Get your food delivered quickly.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h3>🍕 Fresh Food</h3>
                    <p>Prepared with quality ingredients.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow text-center">
                <div class="card-body">
                    <h3>⭐ Easy Ordering</h3>
                    <p>Simple and secure ordering process.</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
