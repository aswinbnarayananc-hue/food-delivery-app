<!DOCTYPE html>
<html>
<head>
    <title>Food Menu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h2>Food Menu</h2>
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead>
                    <tr>
                        <th>Food Item</th>
                        <th>Price (₹)</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                {% for food in foods %}

                <tr>

                    <td>{{ food[1] }}</td>

                    <td>{{ food[2] }}</td>

                    <td>
                        <a href="/order/{{ food[0] }}"
                           class="btn btn-success">
                            Order Now
                        </a>
                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

            <a href="/dashboard"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
